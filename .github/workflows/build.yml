name: Build Windows installer

on:
  push:                   # every upload / commit builds the installer automatically
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:      # or run manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg and deno
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Copy-Item ffmpeg_tmp/*/bin/ffmpeg.exe bin/
          Copy-Item ffmpeg_tmp/*/bin/ffprobe.exe bin/
          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath bin
          Get-ChildItem bin

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF_NAME.TrimStart("v") } else { $v = "1.0.${{ github.run_number }}" }
          "__version__ = `"$v`"" | Set-Content clipflow/_version.py
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build app with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed --name ClipFlow
          --icon assets/icon.ico --add-data "assets;assets"
          --collect-all customtkinter --collect-all yt_dlp_ejs --collect-all certifi
          main.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} installer\clipflow.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: ClipFlow-Setup
          path: Output/*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ClipFlow ${{ steps.ver.outputs.version }}
          files: Output/*.exe
          generate_release_notes: true
